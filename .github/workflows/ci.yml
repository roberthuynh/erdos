name: Lean checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - run: timeout 900 lake exe cache get
      - run: timeout 1800 lake build
      - name: Replay every module through the kernel
        # Each configured module replay has its own 240-second timeout.
        run: python3 -B scripts/replay_modules.py
      - run: timeout 240 python3 -B scripts/check_axioms.py
      - name: Check source coverage and headline registration safeguards
        run: timeout 240 python3 -B scripts/test_release_checks.py
      - name: Check oracle failure paths
        run: timeout 240 python3 -B scripts/test_check_sh.py
      - name: Check replay and validation failure controls
        run: |
          timeout 240 python3 -B scripts/test_replay_modules.py
          timeout 240 python3 -B scripts/test_validation_modes.py
          timeout 240 python3 -B scripts/test_check_docs.py
      - name: Check graph witnesses and release documentation
        run: |
          timeout 240 python3 -B graphs/verify_graphs.py
          timeout 240 python3 -B scripts/check_docs.py
      - name: Check theorem results
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for item in json.loads(Path('scripts/headline-theorems.json').read_text()):
              if item['oracle']:
                  subprocess.run(['timeout', '240', 'bash', 'check.sh',
                                  item['module'].replace('.', '/') + '.lean',
                                  item['declaration']], check=True)
          PY
      - name: Check public export boundary
        run: |
          timeout 240 python3 -B scripts/test_export_manifest.py
          timeout 240 python3 -B scripts/export_manifest.py --output /tmp/public-export-manifest.json
      - name: Check tracked files unchanged
        if: always()
        run: git diff --exit-code HEAD -- .
