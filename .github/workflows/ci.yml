name: Collection checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check receipt bindings, or explicitly reproduce full Lean verification'
        type: choice
        options: [bindings, full]
        default: bindings
        required: true
      problem:
        description: 'Optional problem ID; leave empty to check every registered package'
        type: string
        default: ''
        required: false
permissions:
  contents: read
jobs:
  collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check catalogue, author prose and export boundary
        run: |
          timeout 240 python3 -B scripts/check_collection.py
          timeout 240 python3 -B scripts/test_collection.py
          timeout 240 python3 -B scripts/test_export_manifest.py
          timeout 240 python3 -B scripts/test_check_plan.py
          timeout 240 python3 -B scripts/test_proof_receipts.py
          timeout 240 python3 -B scripts/export_manifest.py --output /tmp/public-export-manifest.json
      - name: Check every package's documentation
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess
          for problem in json.load(open('problems.json'))['problems']:
              subprocess.run(['python3', '-B', 'scripts/check.py', '--problem', problem['id'], '--mode', 'docs', '--output', os.path.join(os.environ['RUNNER_TEMP'], 'erdos-docs', problem['id'])], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: collection-evidence
          path: |
            /tmp/public-export-manifest.json
            ${{ runner.temp }}/erdos-docs/
          if-no-files-found: warn
      - name: Select packages for receipt checks or requested reproduction
        id: scope
        env:
          REQUESTED_PROBLEM: ${{ github.event_name == 'workflow_dispatch' && inputs.problem || '' }}
        run: |
          python3 -B - <<'PYTHON'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from check import load_registry
          registry = load_registry()
          requested = os.environ['REQUESTED_PROBLEM']
          if requested and requested not in registry:
              raise SystemExit('Unknown requested problem')
          selected = [requested] if requested else sorted(registry)
          matrix = {'include': [{'id': key, 'lean': 'lean' in registry[key]} for key in selected]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PYTHON
      - name: Check tracked files unchanged
        if: always()
        run: git diff --exit-code HEAD -- .
  problem:
    needs: collection
    if: ${{ needs.collection.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collection.outputs.matrix) }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && matrix.id == '643' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 150
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare strict proof-check platform
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && matrix.id == '643'
        env:
          HOMEBREW_NO_ANALYTICS: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          python3 -B - <<'PY'
          import os, platform, subprocess, sys
          from pathlib import Path
          if platform.system() != 'Darwin' or platform.machine() != 'arm64':
              raise SystemExit('Problem 643 strict binary pins require Darwin arm64')
          if sys.version_info < (3, 11):
              raise SystemExit('Problem 643 requires Python 3.11 or later')
          subprocess.run(['git', '--version'], check=True, timeout=30)
          subprocess.run(['curl', '--version'], check=True, timeout=30)
          prefix = subprocess.run(['brew', '--prefix', 'coreutils'], capture_output=True, text=True, timeout=30)
          if prefix.returncode or not (Path(prefix.stdout.strip()) / 'libexec/gnubin/timeout').is_file():
              subprocess.run(['brew', 'install', 'coreutils'], check=True, timeout=240)
              prefix = subprocess.run(['brew', '--prefix', 'coreutils'], check=True, capture_output=True, text=True, timeout=30)
          gnubin = Path(prefix.stdout.strip()) / 'libexec/gnubin'
          timeout = str(gnubin / 'timeout')
          version = subprocess.run([timeout, '--version'], check=True, capture_output=True, text=True, timeout=30)
          if 'GNU coreutils' not in version.stdout:
              raise SystemExit('The strict check requires GNU timeout')
          subprocess.run([timeout, '--signal=INT', '--kill-after=5', '2', sys.executable, '-c', 'pass'], check=True, timeout=10)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(gnubin) + '\n')
          print(version.stdout.splitlines()[0])
          PY
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && matrix.lean
        with:
          lake-package-directory: problems/${{ matrix.id }}
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Fetch pinned Mathlib cache
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && matrix.lean
        working-directory: problems/${{ matrix.id }}
        run: timeout 240 lake exe cache get
      - name: Check current mathematical receipt bindings
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'full'
        env:
          PROBLEM: ${{ matrix.id }}
        run: timeout 240 python3 -B scripts/check_proof_receipts.py --problem "$PROBLEM" --output "$RUNNER_TEMP/erdos-evidence"
      - name: Reproduce full verification on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        env:
          PROBLEM: ${{ matrix.id }}
        run: python3 -B scripts/check.py --problem "$PROBLEM" --mode full --output "$RUNNER_TEMP/erdos-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: problem-${{ matrix.id }}-evidence
          path: ${{ runner.temp }}/erdos-evidence/
          if-no-files-found: warn
      - name: Check tracked files unchanged
        if: always()
        run: git diff --exit-code HEAD -- .
